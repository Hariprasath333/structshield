spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/structshield}
    username: ${SPRING_DATASOURCE_USERNAME:structshield_user}
    password: ${SPRING_DATASOURCE_PASSWORD:structshield_secure_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: structshield-detection-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.structshield.*"

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

structshield:
  topics:
    transactions: ${KAFKA_TOPIC_TRANSACTIONS:transactions}
    flags: ${KAFKA_TOPIC_FLAGS:flags}
  detection:
    threshold: ${STRUCTURING_THRESHOLD:2000.00}
    min-cluster-size: ${MIN_CLUSTER_SIZE:3}
    window-minutes: ${ROLLING_WINDOW_MINUTES:5}
    near-ceiling-amount: ${NEAR_CEILING_AMOUNT:1800.00}
    risk-threshold: ${RISK_THRESHOLD:70.00}
    rounding-unit: ${ROUNDING_UNIT:500.00}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_DEV_JWT_SECRET_KEY_MUST_BE_AT_LEAST_32_BYTES}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
